<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        body {
            background-color: #111;

        }
        #parent {
            height: 100%;
            width: 100%;
            background-color: rgb(89, 149, 202);
            display: flex;
            /* align-items: center; x-axis */ 
            align-items: center;
            justify-content: space-evenly; 

        }
        .child {
            height:200px;
            width:200px;
            background-color: red;
            border: 2px solid white;
            background-size: cover;
            background-position: center;
        }
        #child1 {
            background-image: url(https://images.unsplash.com/photo-1786461849823-f4a967329dd1?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNHx8fGVufDB8fHx8fA%3D%3D);
        }
        #child2 {
            background-image: url(https://images.unsplash.com/photo-1786806571457-6fa59a249ceb?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        }
        #child3 {
            background-image: url(https://images.unsplash.com/photo-1773332598289-ed0444ad1d6f?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzMHx8fGVufDB8fHx8fA%3D%3D);
        }
    </style>
</head>
<body>
    <div id="parent">

        <div id="child1" class="child"></div>
        <div id="child2" class="child"></div>
        <div id="child3" class="child"></div>
        
    </div>
</body>
</html>
