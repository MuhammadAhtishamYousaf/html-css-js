<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
        }
        #box1 {
            height: 200px;
            width: 200px;
            background-color: rgb(239, 255, 63);
            border: 2px solid #fff;
            /* margin-top: 20px; */
            position: absolute;
            /* left: 100px;
            top: 100px; */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

        }
        #box2 {
            height: 200px;
            width: 200px;
            background-color:rgb(31, 171, 50);
            border: 2px solid #fff;
            position: absolute;
            right: 50%;
            bottom: 50%;

        }

    </style>
</head>
<body>

    <div id="box1"></div>
    <div id="box2"></div>
    
</body>
</html>
