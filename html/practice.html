<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
        }
        #parent{
            height: 500px;
            width: 500px;
            background-color: black;
        }
        .child {
            height: 50%;
            width: 50%;
            background-color: azure;
        }
        button {
            font-size: 40px;
            font-weight: 500;
            margin: 20px 0 0 100px;
            padding: 10px;
            width: 200px;
            background-color:rgb(13, 133, 33);
            border: none;
            color: white;
            border-radius: 10px;
        }
        button:hover {
            background-color: transparent;
            color: black
        }
    </style>
</head>
<body>
    <div id="parent">
        <div class="child">

        </div>
    </div>

    <button>Focus</button>

    <div class="box1"></div>
    
</body>
</html>
